<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FallFW · research console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231a1a1e'/><text x='1' y='12' font-family='monospace' font-size='11' fill='white'>&gt;_</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* Apply the saved theme before first paint to avoid a flash. Default = dark
     (we ignore prefers-color-scheme on purpose). Mirrored by js/theme.js. */
  (function () {
    try {
      var t = localStorage.getItem('fallfw-theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="stylesheet" href="./css/theme.css">
</head>
<body>
<div id="root"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
