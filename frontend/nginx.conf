server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy API to the gateway (same-origin → no CORS reliance).
    # Use Docker's embedded DNS + a variable upstream so the gateway can be
    # restarted/recreated (new IP) without breaking the proxy or needing a
    # frontend restart.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gw gateway;
        proxy_pass http://$gw:5000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Server-Sent Events: stream immediately, never buffer/cache/timeout out
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
